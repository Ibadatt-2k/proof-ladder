# Full local stack: API + Postgres + Qdrant.  docker compose up --build  ->  http://localhost:8080
services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://proof:proof@db:5432/proofladder
      MEMORY_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      SEED_ON_START: "600"
      LIVE_REPLAY: "true"
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_started}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: proof, POSTGRES_PASSWORD: proof, POSTGRES_DB: proofladder}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U proof"], interval: 3s, retries: 20}
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
